<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAMA 2.0</title>
<style>
  :root {
    --bg: #0b0f14; --teal: #4fd1c5; --blue: #63b3ed; --dim: #7d90a5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(1100px 520px at 50% -10%, #15222f 0%, var(--bg) 62%),
                var(--bg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .stage { text-align: center; cursor: pointer; user-select: none; z-index: 2; }

  .title {
    display: flex; justify-content: center; align-items: baseline;
    font-size: clamp(52px, 14vw, 160px); font-weight: 800; letter-spacing: .045em;
    line-height: 1;
  }
  .title span {
    background: linear-gradient(120deg, var(--teal) 0%, var(--blue) 45%, var(--teal) 90%);
    background-size: 280% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity: 0; transform: translateY(46px) rotateX(55deg) scale(.9); filter: blur(10px);
    animation:
      letter-in .85s cubic-bezier(.2,.85,.3,1.15) var(--d, 0s) forwards,
      shimmer 6s linear calc(var(--d, 0s) + .9s) infinite,
      glow 3.6s ease-in-out calc(var(--d, 0s) + 1s) infinite;
  }
  .title .sp { width: .34em; background: none; animation: none; opacity: 1; }

  .sub {
    margin-top: 22px; color: var(--dim); letter-spacing: .48em; text-indent: .48em;
    text-transform: uppercase; font-size: clamp(10px, 2.1vw, 15px); font-weight: 500;
    opacity: 0; transform: translateY(14px);
    animation: rise .9s cubic-bezier(.2,.8,.3,1) 1.5s forwards;
  }
  .scan {
    height: 2px; width: 0; margin: 20px auto 0; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--teal), var(--blue), var(--teal), transparent);
    animation: scan-in 1.1s ease-out 1.3s forwards, scan-loop 4.5s ease-in-out 2.6s infinite;
  }
  .hint {
    margin-top: 26px; color: #3d4f63; font-size: 12px; letter-spacing: .12em;
    opacity: 0; animation: rise .8s ease 2.2s forwards;
  }

  .p { position: fixed; bottom: -12px; width: 4px; height: 4px; border-radius: 50%;
       background: rgba(79, 209, 197, .45); z-index: 1;
       animation: float-up linear infinite; }
  .p:nth-child(1) { left: 12%; animation-duration: 9s;  animation-delay: 0s;   }
  .p:nth-child(2) { left: 28%; animation-duration: 12s; animation-delay: 2.5s; }
  .p:nth-child(3) { left: 47%; animation-duration: 8s;  animation-delay: 1.2s; }
  .p:nth-child(4) { left: 63%; animation-duration: 11s; animation-delay: 4s;   }
  .p:nth-child(5) { left: 79%; animation-duration: 10s; animation-delay: .6s;  }
  .p:nth-child(6) { left: 91%; animation-duration: 13s; animation-delay: 3.1s; }

  @keyframes letter-in { to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes shimmer   { to { background-position: 280% 0; } }
  @keyframes glow      { 50% { filter: drop-shadow(0 0 22px rgba(99, 179, 237, .5)); } }
  @keyframes rise      { to { opacity: 1; transform: none; } }
  @keyframes scan-in   { to { width: 72%; } }
  @keyframes scan-loop { 50% { transform: scaleX(.35); opacity: .5; } 100% { transform: scaleX(1); } }
  @keyframes float-up  { to { transform: translateY(-108vh); opacity: 0; } }
</style>
</head>
<body>
  <div class="p"></div><div class="p"></div><div class="p"></div>
  <div class="p"></div><div class="p"></div><div class="p"></div>

  <div class="stage" id="stage" title="kliknij, aby odtworzyć animację">
    <div class="title" aria-label="FAMA 2.0">
      <span style="--d:.00s">F</span><span style="--d:.08s">A</span><span style="--d:.16s">M</span><span style="--d:.24s">A</span><span class="sp"></span><span style="--d:.42s">2</span><span style="--d:.50s">.</span><span style="--d:.58s">0</span>
    </div>
    <div class="sub">Adaptive Agent Operating System</div>
    <div class="scan"></div>
    <div class="hint">FAMA nie wykonuje przepisu — konstruuje przepis dla problemu</div>
  </div>

  <script>
    document.getElementById("stage").addEventListener("click", function () {
      document.querySelectorAll(".title span, .sub, .scan, .hint").forEach(function (el) {
        el.style.animation = "none";
        void el.offsetWidth;           // reflow → restart
        el.style.animation = "";
      });
    });
  </script>
</body>
</html>
